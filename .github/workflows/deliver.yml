# Takes one GitHub issue to a tested feature on its own branch — scripts/deliver.sh, the
# same runner a laptop uses, on a hosted runner. The runner commits and pushes the branch
# after every stage, at a stop for a human, on a failure and at the approval, so nothing
# is lost with the job. Run it again with the same key to resume: after answering
# docs/plans/<key>/needs-human.md on the branch, or after a run that ran out of time.
#
# An accepted delivery ends in a PR into main, its body the proof, and dispatches
# preview.yml for it — a PR this workflow opens with GITHUB_TOKEN starts no workflow
# itself. With the SLACK_BOT_TOKEN and SLACK_CHANNEL secrets the run reports to Slack, one
# thread per delivery, and each preview gets a random password posted there.
#
# Plans: docs/plans/ch09/07-delivery-actions-handoff.md, 08-delivery-actions-plan.md and
# 10-delivery-pr-plan.md.
name: deliver
run-name: deliver ${{ inputs.key }}${{ inputs.stub && ' (stub)' || '' }}${{ inputs.restart && ' (restart)' || '' }}

on:
  workflow_dispatch:
    inputs:
      key:
        description: The issue's key — gh-N
        required: true
        type: string
      restart:
        description: Forget the run's progress and start again at plan-writer, on top of the branch
        type: boolean
        default: false
      model:
        description: One model for every stage — default is each stage's own
        type: choice
        options: [default, haiku, sonnet]
        default: default
      stub:
        description: A stub claude — no model, no cost — to prove the plumbing
        type: boolean
        default: false

# Two runs of one issue would race for its branch; each runner has its own k3d, so two
# issues don't clash.
concurrency:
  group: delivery-${{ inputs.key }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: read
  pull-requests: write
  # To dispatch preview.yml for the PR.
  actions: write

env:
  CLAUDE_VERSION: 2.1.301
  K3D_VERSION: v5.9.0
  CLOUDFLARED_VERSION: 2026.9.3
  GITLEAKS_VERSION: 8.30.1
  KEY: ${{ inputs.key }}

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check the inputs
        id: inputs
        env:
          STUB: ${{ inputs.stub }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if ! [[ "$KEY" =~ ^gh-[1-9][0-9]*$ ]]; then
              echo "::error::'$KEY' is not a GitHub issue key — they look like gh-3"
              exit 1
          fi
          if [ "$STUB" != true ] && [ "$HAS_API_KEY" != true ] && [ "$HAS_OAUTH_TOKEN" != true ]; then
              echo "::error::Set the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret, or run with stub"
              exit 1
          fi
          if [ "$STUB" = true ]; then auth="none — stub"
          elif [ "$HAS_API_KEY" = true ]; then auth="ANTHROPIC_API_KEY"
          else auth="CLAUDE_CODE_OAUTH_TOKEN"; fi
          {
              echo "auth=$auth"
              # The runner starts no stage with less than its margin left before this,
              # 5½ hours in; the job's own limit is 6.
              echo "deadline=$(( $(date +%s) + 330 * 60 ))"
              echo "worktree=$(dirname "$GITHUB_WORKSPACE")/caw-$KEY"
          } >>"$GITHUB_OUTPUT"

      - name: Free disk
        # The e2e Compose stack and then k3d with every image: more than a standard
        # runner's free disk holds without this.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL
          df -h / >"$RUNNER_TEMP/df-before.txt"

      - uses: actions/checkout@v7
        with:
          # Every branch and all history: the runner fetches, tracks and fast-forwards
          # the delivery's branch, and takes merge bases against main.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.2.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the tools a run needs
        run: |
          set -euo pipefail
          # The lint hook runs eslint after every edit an agent makes.
          (cd src/frontend && npm ci --no-audit --no-fund)

          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_VERSION"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh \
              | TAG="$K3D_VERSION" bash

          sudo curl -fsSL -o /usr/local/bin/cloudflared \
              "https://github.com/cloudflare/cloudflared/releases/download/$CLOUDFLARED_VERSION/cloudflared-linux-amd64"
          sudo chmod +x /usr/local/bin/cloudflared

          # A preview's own password is bcrypted for Dex with htpasswd.
          command -v htpasswd >/dev/null || sudo apt-get install -y -qq apache2-utils

          # The security hook skips gitleaks when it is missing: install it, so a run
          # here checks what a run on a laptop does.
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | sudo tar -xz -C /usr/local/bin gitleaks

          helm version --short
          kubectl version --client
          docker compose version

      - name: Put the stub claude first on PATH
        if: inputs.stub
        run: |
          mkdir -p "$RUNNER_TEMP/stub"
          cp .claude/delivery/stub-claude "$RUNNER_TEMP/stub/claude"
          cp .claude/delivery/stub-screenshot.png "$RUNNER_TEMP/stub/"
          echo "$RUNNER_TEMP/stub" >>"$GITHUB_PATH"

      - name: Commit as github-actions[bot]
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deliver
        id: deliver
        # A backstop under the job's limit: the deadline should end the run first, at a
        # checkpoint. Killed here, the stage running is rerun from the last checkpoint.
        timeout-minutes: 345
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_URL: ${{ github.server_url }}/${{ github.repository }}
          DELIVER_REMOTE: origin
          DELIVER_DEADLINE: ${{ steps.inputs.outputs.deadline }}
          DELIVER_MODEL: ${{ inputs.model != 'default' && inputs.model || '' }}
          RESTART: ${{ inputs.restart }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The runner keeps these to itself: no agent is given them.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: |
          # Only the secret that is set: claude reads an empty one as set.
          [ -z "$API_KEY" ] || export ANTHROPIC_API_KEY="$API_KEY"
          [ -z "$OAUTH_TOKEN" ] || export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH_TOKEN"
          unset API_KEY OAUTH_TOKEN
          args=("$KEY")
          [ "$RESTART" != true ] || args+=(--restart)
          set +e
          scripts/deliver.sh "${args[@]}"
          status=$?
          echo "status=$status" >>"$GITHUB_OUTPUT"
          # 2 needs a human, 3 paused at an unbuilt stage, 4 out of time: each is a run
          # that did what it should and pushed its branch. Only an error fails the job.
          case "$status" in 0 | 2 | 3 | 4) exit 0 ;; *) exit "$status" ;; esac

      - name: Summary
        if: always()
        env:
          STATUS: ${{ steps.deliver.outputs.status }}
          AUTH: ${{ steps.inputs.outputs.auth }}
          WORKTREE: ${{ steps.inputs.outputs.worktree }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          branch="feature/$KEY"
          plans="$WORKTREE/docs/plans/$KEY"
          {
              case "$STATUS" in
                  0) echo "## ✅ $KEY is ready for review"
                     publish="$WORKTREE/build/delivery/publish.json"
                     if [ -s "$publish" ] && jq -e .url "$publish" >/dev/null; then
                         echo
                         echo "PR: $(jq -r .url "$publish")"
                     elif [ -s "$publish" ]; then
                         echo
                         echo "⚠️ Accepted, but the PR could not be opened: $(jq -r .error "$publish")"
                         echo
                         echo "Run this workflow again with the same key to open it."
                     fi ;;
                  2) echo "## ⚠️ $KEY needs a human"
                     echo
                     echo "Answer the questions in \`docs/plans/$KEY/needs-human.md\` on [\`$branch\`]($REPO_URL/tree/$branch), then run this workflow again with the same key." ;;
                  3) echo "## ⚠️ $KEY paused at a stage with no agent yet"
                     echo
                     echo "Run this workflow again once the agent exists." ;;
                  4) echo "## ⚠️ $KEY ran out of time"
                     echo
                     echo "Every finished stage is on [\`$branch\`]($REPO_URL/tree/$branch). Run this workflow again with the same key to continue." ;;
                  "") echo "## ❌ $KEY did not finish"
                     echo
                     echo "The run was stopped before it could report — the stage running is rerun from the last checkpoint on [\`$branch\`]($REPO_URL/tree/$branch)." ;;
                  *) echo "## ❌ $KEY stopped with an error (exit $STATUS)"
                     echo
                     echo "See the Deliver step's log. A rejected push leaves the run's commits in the \`$KEY-branch\` artifact." ;;
              esac
              echo
              echo "Claude auth: $AUTH. Model: ${{ inputs.model }}."
              if [ -s "$plans/run/history.log" ]; then
                  echo
                  echo "### History"
                  echo
                  echo '```'
                  cat "$plans/run/history.log"
                  echo '```'
              fi
              if [ "$STATUS" = 2 ] && [ -s "$plans/needs-human.md" ]; then
                  echo
                  echo "### Questions"
                  echo
                  cat "$plans/needs-human.md"
              fi
              echo
              echo "### Disk"
              echo
              echo '```'
              echo "before:"; cat "$RUNNER_TEMP/df-before.txt" 2>/dev/null
              echo "after:"; df -h /
              echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Bundle the branch
        if: always()
        env:
          WORKTREE: ${{ steps.inputs.outputs.worktree }}
        run: |
          # The run's commits, recoverable with `git fetch <bundle>` when a push was refused.
          if [ -d "$WORKTREE" ]; then
              git -C "$WORKTREE" bundle create "$RUNNER_TEMP/$KEY.bundle" "feature/$KEY" ^origin/main || true
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.key }}-branch
          path: ${{ runner.temp }}/${{ inputs.key }}.bundle
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.key }}-acceptance
          path: ${{ steps.inputs.outputs.worktree }}/build/acceptance/
          if-no-files-found: ignore
          retention-days: 14

      # Each stage's full transcript holds every tool call and its output, and Actions
      # masks secrets in logs, not in files. A public repo's artifacts are anyone's.
      - uses: actions/upload-artifact@v7
        if: always() && github.event.repository.private
        with:
          name: ${{ inputs.key }}-transcripts
          path: ${{ steps.inputs.outputs.worktree }}/build/delivery/
          if-no-files-found: ignore
          retention-days: 14
