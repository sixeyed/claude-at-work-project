# Alembic CLI config for the Messaging service. Run from this directory:
#
#   POSTGRES_DSN=postgresql+asyncpg://... uv run alembic upgrade head
#
# The URL is left empty on purpose — env.py reads POSTGRES_DSN, so migrations
# use exactly the connection string the service does (Conventions §8), and no
# database address is ever committed.
[alembic]
script_location = messaging/alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
