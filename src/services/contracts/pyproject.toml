[project]
name = "collabhub-contracts"
version = "0.1.0"
description = "Pydantic DTOs and job payload models shared across CollabHub service boundaries"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts"]
