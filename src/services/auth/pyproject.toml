[project]
name = "collabhub-auth"
version = "0.1.0"
description = "CollabHub Auth service — identity, tokens, workspace membership"
requires-python = ">=3.12,<3.13"
dependencies = [
    "collabhub-shared",
    "collabhub-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.2",
    "pyjwt[crypto]>=2.10",
    "alembic>=1.14",
    # The OIDC relying-party leg: discovery, the token exchange, and fetching
    # the provider's JWKS (register D5). Auth is the only service that calls
    # outward to an IdP — everything else verifies tokens locally.
    "httpx>=0.28",
    # Auth is the one service that validates email addresses: it is where an
    # account is created from one.
    "pydantic[email]>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auth"]

[tool.uv.sources]
collabhub-shared = { workspace = true }
collabhub-contracts = { workspace = true }
