[project]
name = "collabhub-testkit"
version = "0.1.0"
description = "CollabHub's test harness: the pytest plugin that enforces the test layers, and the helpers services' tests share. Dev only — no image installs it."
requires-python = ">=3.12,<3.13"
dependencies = [
    # `dexflow` drives Auth's own routes and imports `auth.cookies` / `auth.pkce`,
    # and `testkit.auth` builds Auth's Settings.
    "collabhub-auth",
    # `testkit.search` builds the `messages` index with the Worker's own mapping
    # and writes documents through the Worker's handler, so Messaging's search
    # tests never import `worker` themselves (register D34).
    "collabhub-worker",
    "collabhub-contracts",
    "collabhub-shared",
    "pytest>=9.1",
    "pytest-socket>=0.8.1",
    "httpx>=0.28",
    "testcontainers[postgres,redis,elasticsearch]>=4.15",
    "elasticsearch[async]>=9.1,<10",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "uvicorn>=0.32",
    "pyjwt[crypto]>=2.9",
]

# Loaded by every pytest run in the workspace, with no conftest import — which
# is the point: a conftest can only be shared by importing it, and every
# service's `tests` directory is the same namespace package.
[project.entry-points.pytest11]
collabhub = "testkit.plugin"

[tool.uv.sources]
collabhub-auth = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["testkit"]
