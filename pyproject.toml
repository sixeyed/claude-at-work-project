# uv workspace root. Not a package itself — it exists to tie the service
# packages together and to own the single lockfile (uv.lock) that pins every
# library version. Ranges live in each service's pyproject; exact versions live
# in the lock.
[project]
name = "collabhub"
version = "0.1.0"
description = "CollabHub — team chat + collaborative canvas"
requires-python = ">=3.12,<3.13"
# The root depends on every workspace member so that a plain `uv sync` produces a
# venv the whole test suite can run in. Without this, `uv sync` installs only the
# dev group and prunes the services — `uv sync --all-packages` becomes a step
# everyone has to remember, and forgetting it looks like a broken checkout
# (`ModuleNotFoundError: No module named 'sqlalchemy'`).
dependencies = [
    "collabhub-shared",
    "collabhub-contracts",
    "collabhub-auth",
    "collabhub-messaging",
    "collabhub-canvas",
    "collabhub-asset",
    "collabhub-worker",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/services/*"]

[tool.uv.sources]
collabhub-shared = { workspace = true }
collabhub-contracts = { workspace = true }
collabhub-auth = { workspace = true }
collabhub-messaging = { workspace = true }
collabhub-canvas = { workspace = true }
collabhub-asset = { workspace = true }
collabhub-worker = { workspace = true }
collabhub-testkit = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "testcontainers[postgres,redis]>=4.9",
    "pytest-bdd>=8.1",
    "pytest-playwright>=0.7",
    "asyncpg>=0.30",
    "pytest-cov>=7.1",
    # The test harness and its pytest plugin. A dev dependency, not one of the
    # root's `dependencies`: it is a workspace member, but nothing ships it.
    "collabhub-testkit",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Makes the Gherkin suite importable as `bdd.*`. Every service also has a
# `tests` directory, and together they form one namespace package with no
# `__init__.py`, which is why `from tests…` is banned (ruff TID251): it would
# silently bind to whichever service's `tests` sorts first. Rooting at
# `tests/` and naming this package `bdd` still avoids colliding with any of
# them.
pythonpath = ["tests"]
# `tests` is the Gherkin suite at the repo root; without it here the .feature
# files are simply not collected.
testpaths = ["src/services", "tests"]
# `unit` and `integration` are not declared here: testkit's plugin registers
# them and sets them from the directory a test lives in (register D32).
#
# `bdd` is the full-stack Gherkin suite: it drives a real browser against a
# `docker compose up` stack, so unlike `integration` it cannot start what it
# needs and will tell you to bring the stack up instead.
markers = [
    "bdd: needs the Compose stack already running; drives a real browser",
    # pytest-bdd turns every Gherkin tag into a marker of the same name, so a
    # tag used in a .feature file has to be declared here too.
    "smoke: proves the harness reaches the running stack end to end",
    # The Gherkin for slices 2-6 was written and approved in one go, ahead of
    # the code, so most of the suite describes behaviour nothing implements yet.
    # `tests/bdd/conftest.py` intercepts `pending` and turns it into a skip
    # rather than a marker of the same name — it is declared here so the tag
    # still resolves if that hook is ever removed.
    "pending: the slice that owns this scenario has not been built yet",
    # The per-slice `s2`-`s6` markers are gone: every one of those slices has
    # delivered and dropped its own tag, and a marker no scenario carries is a
    # `-m` selector that silently matches nothing.
]
# Every service has a tests/unit/test_health.py. The default "prepend" import mode
# derives module names from the file path relative to the rootdir and they
# collide; importlib mode keeps them distinct without needing __init__.py files.
# `-p pytester` because testkit's own tests need the fixture, and pytest refuses
# `pytest_plugins` in any conftest below the rootdir.
addopts = "--import-mode=importlib -p pytester"

# Reported on the unit layer, not gated (register D32): a floor is set once the
# backfill has measured one. The service packages only — not their tests, not
# testkit, not Alembic revisions.
[tool.coverage.run]
source_pkgs = ["shared", "contracts", "auth", "messaging", "canvas", "asset", "worker"]
branch = true
omit = ["*/alembic/*"]

[tool.coverage.report]
skip_empty = true
