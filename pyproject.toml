# uv workspace root. Not a package itself — it exists to tie the service
# packages together and to own the single lockfile (uv.lock) that pins every
# library version. Ranges live in each service's pyproject; exact versions live
# in the lock.
[project]
name = "collabhub"
version = "0.1.0"
description = "CollabHub — team chat + collaborative canvas"
requires-python = ">=3.12,<3.13"
# The root depends on every workspace member so that a plain `uv sync` produces a
# venv the whole test suite can run in. Without this, `uv sync` installs only the
# dev group and prunes the services — `uv sync --all-packages` becomes a step
# everyone has to remember, and forgetting it looks like a broken checkout
# (`ModuleNotFoundError: No module named 'sqlalchemy'`).
dependencies = [
    "collabhub-shared",
    "collabhub-contracts",
    "collabhub-auth",
    "collabhub-messaging",
    "collabhub-canvas",
    "collabhub-asset",
    "collabhub-worker",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/services/*"]

[tool.uv.sources]
collabhub-shared = { workspace = true }
collabhub-contracts = { workspace = true }
collabhub-auth = { workspace = true }
collabhub-messaging = { workspace = true }
collabhub-canvas = { workspace = true }
collabhub-asset = { workspace = true }
collabhub-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "testcontainers[postgres,redis]>=4.9",
    "pytest-bdd>=8.1",
    "pytest-playwright>=0.7",
    "asyncpg>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Makes the Gherkin suite importable as `bdd.*`. Every service also has a
# `tests` directory, so a root-level `tests` package would make `import tests`
# ambiguous and break Auth's `from tests import dexflow`; rooting at `tests/`
# and naming the package `bdd` collides with nothing.
pythonpath = ["tests"]
# `tests` is the Gherkin suite at the repo root; without it here the .feature
# files are simply not collected.
testpaths = ["src/services", "tests"]
# Integration tests start real Postgres/Redis containers (Conventions §11), so
# they need Docker and take seconds rather than milliseconds. Run the fast ones
# alone with `uv run pytest -m "not integration"`.
#
# `bdd` is the full-stack Gherkin suite: it drives a real browser against a
# `docker compose up` stack, so unlike `integration` it cannot start what it
# needs and will tell you to bring the stack up instead.
markers = [
    "integration: needs Docker; starts real backing services",
    "bdd: needs the Compose stack already running; drives a real browser",
    # pytest-bdd turns every Gherkin tag into a marker of the same name, so a
    # tag used in a .feature file has to be declared here too.
    "smoke: proves the harness reaches the running stack end to end",
]
# Every service has a tests/test_health.py. The default "prepend" import mode
# derives module names from the file path relative to the rootdir and they
# collide; importlib mode keeps them distinct without needing __init__.py files.
addopts = "--import-mode=importlib"
