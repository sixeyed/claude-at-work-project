{{- $app := .Values.appRelease }}
{{- $ctx := dict "root" $ "name" "ingress" }}
# One origin for the SPA, every public API and Dex. Register D22 needs the SPA
# and the API same-site — the refresh cookie is SameSite=Strict — and same-origin
# also means no CORS at all.
#
# The routes are an allow-list of public prefixes. Nothing matches
# /api/v1/internal/ (Conventions §5.5) or /health, so those fall through to the
# SPA's index.html and never reach a service.
#
# Canvas and Asset have no public API yet. When Canvas gets real-time it will
# want /socket.io too, which Messaging already holds — that is a decision for
# then, not a route to guess at now.
#
# Traefik balances across pods itself and ignores a Service's sessionAffinity.
# The SPA opens Socket.IO as a websocket first, which stays on one pod, so that
# only matters if a client ever falls back to long-polling.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collabhub
  labels:
    {{- include "collabhub-local.labels" $ctx | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          {{- range list "/api/v1/auth" "/api/v1/users" "/api/v1/workspaces" "/.well-known" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $app }}-auth
                port:
                  name: http
          {{- end }}
          {{- range list "/api/v1/channels" "/api/v1/messages" "/socket.io" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $app }}-messaging
                port:
                  name: http
          {{- end }}
          - path: /dex
            pathType: Prefix
            backend:
              service:
                name: dex
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $app }}-frontend
                port:
                  name: http
