{{- $ctx := dict "root" $ "name" "elasticsearch" }}
# Written only by the Worker, and everything in it is derived from data other
# services own — so no volume. A restart loses an index that can be rebuilt.
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    {{- include "collabhub-local.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "collabhub-local.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  labels:
    {{- include "collabhub-local.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "collabhub-local.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "collabhub-local.selectorLabels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: elasticsearch
          image: {{ .Values.elasticsearch.image }}
          env:
            # single-node also skips the production bootstrap checks, which is
            # why no vm.max_map_count change is needed on the node.
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms{{ .Values.elasticsearch.heap }} -Xmx{{ .Values.elasticsearch.heap }}"
          ports:
            - name: http
              containerPort: 9200
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: data
          emptyDir: {}
