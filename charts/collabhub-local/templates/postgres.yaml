{{- $ctx := dict "root" $ "name" "postgres" }}
# One instance holding one database per service (docker/postgres/init.sql).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    {{- include "collabhub-local.labels" $ctx | nindent 4 }}
data:
  10-databases.sql: |
    {{- required "postgres.initSql is empty: pass --set-file postgres.initSql=docker/postgres/init.sql, as scripts/deploy.sh does" .Values.postgres.initSql | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "collabhub-local.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "collabhub-local.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "collabhub-local.labels" $ctx | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "collabhub-local.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "collabhub-local.selectorLabels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.user | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            periodSeconds: 5
          volumeMounts:
            # Postgres 18 keeps data in a major-version subdirectory, so the
            # volume goes at /var/lib/postgresql, not .../data — see
            # docker-compose.yml.
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
