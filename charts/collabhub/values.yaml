# CollabHub — one chart, one release, all six components.
#
# Each component has its own templates under templates/<component>/, rather than
# one set of templates ranging over this map. They start near-identical and are
# meant to diverge: the Worker runs as KEDA-scaled pools, each component has its
# own NetworkPolicy, the frontend has no config at all.
#
# Deliberately absent: PostgreSQL, Redis, Elasticsearch and Garage. This chart
# deploys CollabHub's own workloads and expects the data stores to already
# exist — they have their own lifecycle, backups and upgrade cadence, and
# bundling them would make `helm uninstall` a data-loss command.
#
# Also absent: an Ingress. Which hosts route where is a per-environment
# decision, and anything under /api/v1/internal/ must never be routed from the
# public ingress at all (Conventions §5.5).

nameOverride: ""
fullnameOverride: ""

imagePullPolicy: IfNotPresent
terminationGracePeriodSeconds: 30

# Applied to every component unless it overrides the same key.
defaults:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

components:
  auth:
    enabled: true
    replicaCount: 2
    port: 8000
    image:
      repository: collabhub/auth
      # Empty means "use the chart's appVersion", keeping image and chart in step.
      tag: ""
    service:
      create: true
      type: ClusterIP
    probes:
      live: /health/live
      ready: /health/ready
    env:
      APP_ENV: production
      LOG_LEVEL: info
      AUTH_ISSUER: https://auth
      AUTH_AUDIENCE: collabhub
      AUTH_INTERNAL_AUDIENCE: collabhub-internal
      AUTH_ACCESS_TOKEN_MINUTES: "15"
      AUTH_REFRESH_TOKEN_DAYS: "30"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    # Supplies POSTGRES_DSN, REDIS_CACHE_URL, AUTH_SIGNING_KEY.
    envFromSecrets:
      - collabhub-auth

  messaging:
    enabled: true
    replicaCount: 2
    port: 8000
    image:
      repository: collabhub/messaging
      tag: ""
    service:
      create: true
      type: ClusterIP
    probes:
      live: /health/live
      ready: /health/ready
    env:
      APP_ENV: production
      LOG_LEVEL: info
      AUTH_ISSUER: https://auth
      AUTH_AUDIENCE: collabhub
      AUTH_JWKS_URL: http://collabhub-auth:8000/.well-known/jwks.json
      MESSAGING_MAX_BODY_CHARS: "8000"
      MESSAGING_MAX_ATTACHMENTS: "10"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    # Supplies POSTGRES_DSN, all three REDIS_*_URL values and ELASTICSEARCH_URL.
    envFromSecrets:
      - collabhub-messaging

  canvas:
    enabled: true
    replicaCount: 2
    port: 8000
    image:
      repository: collabhub/canvas
      tag: ""
    service:
      create: true
      type: ClusterIP
    probes:
      live: /health/live
      ready: /health/ready
    env:
      APP_ENV: production
      LOG_LEVEL: info
      AUTH_ISSUER: https://auth
      AUTH_AUDIENCE: collabhub
      AUTH_JWKS_URL: http://collabhub-auth:8000/.well-known/jwks.json
      CANVAS_SNAPSHOT_INTERVAL_SECONDS: "10"
      CANVAS_SNAPSHOT_EVERY_UPDATES: "200"
      CANVAS_MAX_DOC_BYTES: "26214400"
      CANVAS_AWARENESS_TIMEOUT_SECONDS: "30"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    envFromSecrets:
      - collabhub-canvas

  asset:
    enabled: true
    replicaCount: 2
    port: 8000
    image:
      repository: collabhub/asset
      tag: ""
    service:
      create: true
      type: ClusterIP
    probes:
      live: /health/live
      ready: /health/ready
    env:
      APP_ENV: production
      LOG_LEVEL: info
      AUTH_ISSUER: https://auth
      AUTH_AUDIENCE: collabhub
      AUTH_INTERNAL_AUDIENCE: collabhub-internal
      AUTH_JWKS_URL: http://collabhub-auth:8000/.well-known/jwks.json
      OBJECT_STORE_BUCKET: collabhub-assets
      OBJECT_STORE_PRESIGN_TTL_SECONDS: "900"
      ASSET_MAX_UPLOAD_BYTES: "52428800"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    # Supplies POSTGRES_DSN, REDIS_STREAMS_URL, OBJECT_STORE_*_KEY.
    envFromSecrets:
      - collabhub-asset

  worker:
    enabled: true
    # Only used with autoscaling disabled, when every enabled pool runs this many. With
    # it enabled KEDA owns replicas and the Deployments omit the field.
    replicaCount: 1
    port: 8000
    image:
      repository: collabhub/worker
      tag: ""
    service:
      # No Service: the Worker serves no traffic. Its port carries health probes
      # only, and those are scraped from the pod (design doc 05 §2).
      create: false
      type: ClusterIP
    probes:
      live: /health/live
      ready: /health/ready
    env:
      APP_ENV: production
      LOG_LEVEL: info
      WORKER_MAX_ATTEMPTS: "5"
      WORKER_VISIBILITY_TIMEOUT_SECONDS: "60"
      WORKER_BATCH_SIZE: "16"
      WORKER_DEAD_LETTER_MAXLEN: "10000"
      OBJECT_STORE_BUCKET: collabhub-assets
      ASSET_INTERNAL_URL: http://collabhub-asset:8000/api/v1/internal
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # For KEDA, not the Worker process: the Redis Streams scaler takes
      # host:port and cannot parse the REDIS_STREAMS_URL the Worker uses. Must
      # name the same Redis as the collabhub-worker secret's REDIS_STREAMS_URL —
      # two settings, one instance — or KEDA scales on a different Redis than
      # the Worker reads. The TriggerAuthentication sets no `enableTLS`, so a
      # TLS-only R3 is not supported yet.
      REDIS_STREAMS_ADDRESS: redis-streams:6379
    # Supplies REDIS_STREAMS_URL, REDIS_STREAMS_PASSWORD (read by KEDA),
    # ELASTICSEARCH_URL, OBJECT_STORE_*_KEY, SERVICE_TOKEN_URL and
    # WORKER_SERVICE_CLIENT_SECRET.
    envFromSecrets:
      - collabhub-worker
    autoscaling:
      # Requires KEDA (keda.sh/v1alpha1); the chart fails without it.
      enabled: true
      pollingInterval: 30
      cooldownPeriod: 300
      consumerGroup: worker # doc 05 §5.1
      lagCount: "5"
    # One Deployment and one ScaledObject per enabled pool (register D17). Split
    # on latency: notify keeps a floor for its < 5 s p95 target, batch scales
    # from zero. A pool's streams become its WORKER_STREAMS.
    #
    # List only streams the Worker has handlers for. It exits at startup on any
    # other, and under KEDA a crashing pod never creates its consumer group, so
    # KEDA keeps adding pods (doc 05 §5.3). jobs:index is the only one built:
    # add jobs:thumbnail, jobs:export and jobs:retention to batch, and enable
    # notify, as their handlers ship. An enabled pool with no streams fails the
    # render.
    pools:
      notify:
        # Off until a jobs:notify handler exists.
        enabled: false
        streams:
          - jobs:notify
        minReplicas: 1
        maxReplicas: 5
      batch:
        enabled: true
        streams:
          - jobs:index
        minReplicas: 0
        maxReplicas: 10

  frontend:
    enabled: true
    replicaCount: 2
    # Nginx listens on 8080 because the pod runs it as UID 101 and non-root
    # cannot bind a privileged port. See docker/frontend/nginx.conf.
    port: 8080
    image:
      repository: collabhub/frontend
      tag: ""
    service:
      create: true
      type: ClusterIP
    probes:
      # Static assets behind Nginx — no /health endpoints to probe.
      live: /
      ready: /
    # No env and no ConfigMap: the SPA's settings are inlined into the bundle at
    # build time as VITE_* build args, so there is nothing to configure at
    # runtime. Changing them means rebuilding the image.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 101 # nginx
      fsGroup: 101
    containerSecurityContext:
      allowPrivilegeEscalation: false
      # Nginx writes its pid and proxy cache to disk.
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL

# NetworkPolicy — one per component, each declaring Ingress and Egress, so
# anything a policy does not list is denied in both directions.
#
# Traffic inside the release is matched on this chart's labels. Everything
# outside it is a peer below: a NetworkPolicyPeer list (selectors or ipBlock)
# plus ports, because where Postgres, Redis and the rest live is per
# environment. A peer an enabled component needs, left empty, fails the render.
#
# NetworkPolicy is L3/L4. It cannot keep /api/v1/internal/ away from the
# ingress controller, which reaches the same port as the public routes — that
# stays an ingress routing rule (Conventions §5.5). And it is only enforced by
# a CNI that implements it; elsewhere these objects apply and block nothing.
networkPolicy:
  enabled: true
  peers:
    # Default assumes ingress-nginx in namespace ingress-nginx. Set this per
    # environment for any other ingress controller or Gateway API implementation.
    ingressController:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
    dns:
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    postgres:
      to: []
      ports:
        - port: 5432
          protocol: TCP
    # R1 — cache and token denylist.
    redisCache:
      to: []
      ports:
        - port: 6379
          protocol: TCP
    # R2 — Socket.IO backplane.
    redisRealtime:
      to: []
      ports:
        - port: 6379
          protocol: TCP
    # R3 — job streams.
    redisStreams:
      to: []
      ports:
        - port: 6379
          protocol: TCP
    elasticsearch:
      to: []
      ports:
        - port: 9200
          protocol: TCP
    # Garage's S3 API, or whatever S3-compatible store replaces it.
    objectStore:
      to: []
      ports:
        - port: 3900
          protocol: TCP
    otelCollector:
      to: []
      ports:
        - port: 4317
          protocol: TCP
    # Auth's upstream IdP (register D5) — discovery, token exchange and JWKS.
    oidcProvider:
      to: []
      ports:
        - port: 443
          protocol: TCP
